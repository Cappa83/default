name: Build ACE RFID PR45

on:
  push:
    branches:
      - ace-rfid-pr45-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          repository: vk2amv/ACE-RFID
          ref: fix-broken-pixel-nfc
          path: ace-rfid

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ace-rfid/Android/AceRFID
        run: gradle --no-daemon clean assembleDebug

      - name: Verify output
        shell: bash
        run: |
          ls -lh ace-rfid/Android/AceRFID/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ace-rfid/Android/AceRFID/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACE-RFID-PR45-debug-apk
          path: ace-rfid/Android/AceRFID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
